<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div class="crt-overlay"></div>

  <header class="topbar">
    <span class="topbar-logo">LABOS</span>
    <button id="settings-btn" class="icon-btn">⚙ SETTINGS</button>
  </header>

  <main id="app" class="dashboard-grid screen active">
    <section class="widget">
      <h2 class="widget-title">Study Tracker</h2>
      <div class="tracker-form">
        <input type="text" id="subject-input" class="tracker-input" placeholder="Subject..." />
        <input type="number" id="minutes-input" class="tracker-input tracker-input-small" placeholder="Min" />
        <button id="add-session-btn" class="icon-btn">+ ADD</button>
      </div>
      <ul id="session-list" class="session-list"></ul>
    </section>

    <section class="widget">
      <h2 class="widget-title">Research Journal</h2>
      <div class="tracker-form">
        <textarea id="journal-input" class="tracker-input journal-textarea" placeholder="Write an entry..."></textarea>
      </div>
      <button id="add-entry-btn" class="icon-btn">+ SAVE ENTRY</button>
      <ul id="journal-list" class="session-list"></ul>
    </section>

    <section class="widget">
      <h2 class="widget-title">Task Manager</h2>
      <p class="widget-placeholder">Coming online...</p>
    </section>
    <section class="widget">
      <h2 class="widget-title">Pomodoro</h2>
      <p class="widget-placeholder">Coming online...</p>
    </section>
  </main>

  <section id="settings-screen" class="screen settings-screen">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="back-btn" class="icon-btn">← BACK</button>
    </div>

    <h3 class="settings-section-title">Theme</h3>
    <div id="theme-picker" class="theme-picker"></div>

    <h3 class="settings-section-title">Font</h3>
    <div id="font-picker" class="theme-picker"></div>
  </section>

  <script src="js/theme.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
